# SecAgent 阈值/抑制文件（2026-10-13）
# 位置说明：放在 **已挂载** 的 rules 目录（容器内 /var/lib/suricata/rules/threshold.conf），
# 因为 compose 只挂载了 etc/suricata.yaml 与 rules/、logs/ —— 之前把文件放在镜像层的
# /etc/suricata/threshold.conf 里，**实际上从未被加载**（0 字节、无挂载）。
#
# 当前策略：**只保留机制，不启用任何抑制**。
# 原因（2026-10-13 决定）：原计划里的 `threshold gen_id 1, sig_id 2001219, type threshold, count 3, seconds 10`
#   会把"单次扫描"的告警压掉（不足 3 次/10 秒不报），与演练预期和检测目标冲突 ——
#   宁可多报也不能漏报。若将来确实要压运维误报，请用更精确的 `suppress`（按源/目的/端口限定），
#   并同时在 RUNBOOK §11 与演练用例里同步更新预期。
#
# 语法示例（默认注释掉，需要时再启用）：
# suppress gen_id 1, sig_id 2001219

# ---------------------------------------------------------------------------
# 2026-10-18 生产噪音抑制：sid 2013031（SecAgent 上报链路心跳 10.0.0.10 → 169.254.0.4:80 POST /ca_report.cgi）
#   规模：7 天 290,088 条，占全部 alert 的 94.9%；实测 ~320 条/10 分钟、~1,800 条/30 分钟。
#   这是运维心跳不是攻击，但「整条 sig 压掉」会把同 sid 命中的真实外部探测（Python-urllib 类）一起吞掉，
#   所以这里按【源 IP + sid】精确抑制：只压 10.0.0.10 这个心跳源，其它源/其它 sid 一律不动。
#   验证：改前 10 分钟 319 条 → 改后 10 分钟见 /root/backup-srv2fix*/report；同期 1000102/1000104 计数不变。
#   残余风险（明说）：10.0.0.10 若被攻陷，它对外的心跳类流量在 Suricata 侧不可见，需要靠主机侧/Wazuh 侧告警补位。
suppress gen_id 1, sig_id 2013031, track by_src, ip 10.0.0.10

# opt-in（默认关闭，需签字才启用）：连「非 10.0.0.10 源的 2013031」也一起压掉时才取消下面注释。
# 风险：真实外部 Python-urllib 扫描命中的 2013031 会一并消失（历史上 alltime 290,088 条里这类占比极小）。
# suppress gen_id 1, sig_id 2013031
