<!DOCTYPE html>
<html lang="{{ site.Language.Lang | default `zh-CN` }}" data-xk-gate="1">
<head>
{{ partial "xk-demo/head-meta.html" . }}
  <meta name="robots" content="index, follow">
  <link rel="preload" as="image" href="/images/crt/desk.webp" fetchpriority="high">
<style>
  /* ★2026-11-04 站主口径：「主页直接删掉，只留一个进入动画」。
     这一页只做一件事 —— 让第一次来的人 2.6 秒知道这是哪儿，然后进 /alerts/。
     旧的电视房间整份搬到 /room/（登录后可见），这里一个字节的 canvas 都不跑。 */
  :root{
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    --txt:#FAF7F0; --mut:#B9C2C8; --acc:#7FD4D8; --line:rgba(255,246,235,.16);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:#05080a; color:var(--txt); font-family:var(--sans);
    display:grid; place-items:center; overflow:hidden;
  }
  .g-bg{
    position:fixed; inset:0; z-index:0;
    background:url("/images/crt/desk.webp") center/cover no-repeat;
    filter:saturate(.85) brightness(.55) blur(1.5px);
    transform:scale(1.04);
  }
  .g-veil{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(60% 55% at 50% 46%, rgba(0,0,0,0) 0%, rgba(4,7,9,.55) 62%, rgba(4,7,9,.88) 100%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 2px, rgba(0,0,0,0) 2px 4px);
    mix-blend-mode:multiply;
  }
  .g-wrap{position:relative; z-index:2; text-align:center; padding:0 24px; max-width:640px}
  .g-badge{
    display:inline-flex; align-items:center; gap:8px;
    font:600 12px/1 var(--mono); letter-spacing:.18em; text-transform:uppercase;
    color:var(--acc); border:1px solid rgba(127,212,216,.35); border-radius:999px;
    padding:7px 14px; margin-bottom:22px; background:rgba(9,16,19,.55);
  }
  .g-badge i{width:6px; height:6px; border-radius:50%; background:var(--acc); box-shadow:0 0 10px var(--acc)}
  .g-title{
    font:700 clamp(26px,4.4vw,42px)/1.25 var(--sans);
    margin:0 0 14px; letter-spacing:.02em; text-shadow:0 2px 24px rgba(0,0,0,.6);
  }
  .g-sub{margin:0 0 30px; color:var(--mut); font-size:15px; line-height:1.75}
  .g-sub b{color:var(--txt); font-weight:600}
  .g-bar{
    width:min(320px,72vw); height:3px; margin:0 auto 14px;
    background:rgba(255,246,235,.14); border-radius:99px; overflow:hidden;
  }
  .g-bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,#7FD4D8,#b9f3f5); animation:grow 2.6s linear forwards}
  @keyframes grow{to{width:100%}}
  .g-tip{margin:0; font:12px/1.6 var(--mono); color:var(--mut); letter-spacing:.08em}
  .g-skip{
    position:fixed; right:20px; bottom:18px; z-index:3;
    color:var(--mut); text-decoration:none; font:12px/1 var(--mono); letter-spacing:.1em;
    border:1px solid var(--line); border-radius:999px; padding:9px 14px;
    background:rgba(9,16,19,.6);
  }
  .g-skip:hover,.g-skip:focus-visible{color:var(--txt); border-color:rgba(127,212,216,.5)}
  @media (prefers-reduced-motion: reduce){ .g-bar i{animation-duration:.2s} }
</style>
</head>
<body>
  <div class="g-bg" aria-hidden="true"></div>
  <div class="g-veil" aria-hidden="true"></div>

  <main class="g-wrap" id="content" data-xk-ssr="gate">
    <div class="g-badge"><i></i>XK-LAB</div>
    <h1 class="g-title">一个人搭的公网安全观测站</h1>
    <p class="g-sub">
      主机 · 网络 · 蜜罐 <b>三路采集</b>，7×24 盯着谁在打它。<br>
      能看到攻击实况、每份日报，和这些数字背后的原始日志。
    </p>
    <div class="g-bar"><i></i></div>
    <p class="g-tip">正在进入攻击实况 …</p>
  </main>

  <a class="g-skip" href="/alerts/">跳过 ↗</a>

<script>
  /* 一次会话只放一次：同标签页第二次进来直接去 /alerts/，不重复下载这张照片。 */
  (function(){
    var NEXT = '/alerts/';
    var KEY = 'xk-entered';
    var seen = false;
    try { seen = sessionStorage.getItem(KEY) === '1'; } catch(e) {}
    if (seen) { location.replace(NEXT); return; }
    try { sessionStorage.setItem(KEY, '1'); } catch(e) {}
    setTimeout(function(){ location.replace(NEXT); }, 2600);
  })();
</script>
</body>
</html>
