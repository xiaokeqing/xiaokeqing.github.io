{{- /* ============================================================================
   /alerts/ = `docs/demo-内容页外壳.html` 的 `v-monitor`（监测中心）那一屏**整份搬**（第四批口径）。
   ----------------------------------------------------------------------------
   搬过来的：外壳的 <style> 逐字、常驻件（底图/dock/HOLO/背景选择器）逐字、
   四屏标记逐字（★T27：靶场/关于两屏已删）、两段内联 <script> 逐字；本页初始 .on 落在 v-monitor。
   只改两处：① 素材路径 → static/ 真文件 ② dock 的 <button data-v> → <a href="真路由">
   不动：站点的 SPA 外层 / kurisu-player / 状态机 / 语音 / 口型。
   保留的不可见契约：Hugo <head> + <main id="content" data-xk-ssr="monitor"> + #xk-views 占位。
   重现方式：python _dev/gen-demo-pages.py
   ============================================================================ */ -}}
{{- $v := "monitor" -}}
<!DOCTYPE html>
<html lang="{{ site.Language.Lang | default `zh-CN` }}" data-xk-kurisu-mode="video">
<head>
{{ partial "xk-demo/head-meta.html" . }}
  {{- /* ★V3（2026-10-17）：极弱网省流模式。head 里同步引入（2KB），只为尽早判定（saveData/2g/3g
         或 ?xk-saver=1）并给 <html> 上 xk-saver 类；重活（不启动状态机/不取垫板）由它自己安排。 */}}
  <script src="/js/xk-saver.js"></script>
{{ partial "xk-demo/shell-style.html" . }}
</head>
<body data-skin="warm" data-phone="v1" class="xk-has-idcard{{ if eq $v "ai" }} is-ai{{ end }}">
{{ partial "xk-demo/shell-chrome.html" (dict "v" $v) }}
<main class="main" id="content" data-xk-ssr="monitor">
{{ partial "xk-demo/shell-views.html" (dict "v" $v "page" .) }}
</main>
{{ partial "xk-demo/site-foot.html" . }}
<div id="xk-views" hidden aria-hidden="true"></div>
{{ partial "xk-demo/idcard.html" . }}
  {{- /* ★批次A-P1：统一播放器按需加载（同主页那条理由：138KB 放进首屏会顶爆 /ai/ 的门禁） */}}
{{ partial "xk-demo/shell-script.html" . }}
{{ partial "xk-demo/api-bind.html" . }}
{{- /* ★V2/V3（2026-11-07）：24h 热力 + 严重度环。不吃新端点，只读 xk-bind 已取到的 stats24h；
     同步加载（不加 defer）→ 首帧先画「—」骨架，数据回来后由 xk-bind 调 window.__xkViz 补画。 */}}
<script src="{{ (resources.Get "js/xk-viz.js" | minify | fingerprint).RelPermalink }}"></script>
{{- /* ★2026-11-09：告警链路桑基图（数据统计 tab）。本脚本仅 ~6KB 常驻；
     echarts（~1MB）由它按视口/慢网口径懒加载，不走 CDN。 */ -}}
<script src="{{ (resources.Get "js/xk-sankey.js" | minify | fingerprint).RelPermalink }}" defer></script>
<script src="/js/xk-realtime.js" defer></script>
</body>
</html>
