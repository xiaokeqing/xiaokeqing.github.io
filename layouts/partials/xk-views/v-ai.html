<section class="view" id="v-ai">
   <div class="ai-grid">
    <div class="chatwrap">
      <div class="chat">
        <div class="chat-hd">
          <span class="badge"><span class="dot"></span>AI 安全 · 等待提问</span>
          <span class="quota">额度：— · 每 IP 6 次/分钟</span>
        </div>
        <div class="chatlog" id="chatlog">
          <div class="msg ai"><div class="who">AI 安全 · <span class="st">模型研判</span></div>你好，这里是公开只读的安全知识库问答。问题会走真实检索增强链路，答案附带引用与状态标注；只解释概念与防御，不读取内部事件数据。</div>
          <div class="msg me">那我们昨天被谁打了？</div>
          <div class="msg ai"><div class="who">AI 安全 · <span class="st">规则解析（拒答）</span></div>这个问题需要内部事件数据，公开问答不取证 —— 可以去「监测中心」看脱敏后的真实统计。</div>
        </div>
        <div class="chat-ft">
          <input id="askInput" placeholder="问一个安全概念或防御做法…（Enter 发送）">
          <button id="askBtn">发送</button>
        </div>
      </div>
      <p class="chat-note">回答非流式传输（一次性返回 + 前端渐进显示）· 取不到就显示原因，绝不编答案</p>
    </div>

    <!-- 手机里的她：CSS 手机框 + 半身动画（素材包无手机框，纯 CSS 画） -->
    <aside class="phone live" id="phone" aria-label="手机里的桐莉栖（演示）">
      <div class="phone-scr">
        <canvas id="phoneCanvas" width="132" height="132" aria-hidden="true"></canvas>
        <div class="phone-status"><span id="phoneClock">21:47</span><span>HOLO-LINK · 5G ▮</span></div>
        <div class="phone-line" id="phoneLine">问点什么吧，我在这边听着。</div>
        <div class="phone-live">
          <div class="bars2"><i></i><i></i><i></i><i></i><i></i></div>
          <span id="phoneState">IDLE</span>
        </div>
      </div>
      <p class="phone-hint">她活在手机里 · 随对话互动</p>
    </aside>
   </div>
  </section>
