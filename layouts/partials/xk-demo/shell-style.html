{{- /* docs/demo-内容页外壳.html 的 <style> 逐字（第 7–398 行）+ 一条 <a> 伴随规则 */ -}}
<style>
  :root{
    --shade:.08;
    /* 暖烟灰玻璃：取色自背景实验室（暖灰棕调），非白非黑 */
    --panel:rgba(54,51,46,.24);
    --panel2:rgba(42,40,36,.13);
    --line:rgba(255,246,235,.15);
    --line2:rgba(255,246,235,.28);
    --txt:#FAF7F0; --mut:#D2CBBD;
    --acc:#7FD4D8; --acc2:#B0A0E8;
    --ok:#6FD3A0; --warn:#E8B45A; --bad:#E8837B;
    --solid:rgba(48,45,41,.82);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; --r:12px;
  }
  body[data-skin="light"]{
    --panel:rgba(255,255,255,.55);
    --panel2:rgba(255,255,255,.40);
    --line:rgba(30,45,60,.20);
    --line2:rgba(30,45,60,.34);
    --txt:#22354A; --mut:#5A6B7C;
    --acc:#0E7490; --acc2:#6D5BD0;
    --ok:#16A34A; --warn:#B45309; --bad:#DC2626;
    --solid:rgba(255,255,255,.9);
  }
  body[data-skin="dark"]{
    --panel:rgba(15,19,25,.58);
    --panel2:rgba(12,15,20,.42);
    --line:rgba(255,255,255,.16);
    --line2:rgba(255,255,255,.28);
    --txt:#EDEAE4; --mut:#9AA7B0;
    --acc:#39D0D8; --acc2:#A78BFA;
    --ok:#3ECF8E; --warn:#F5A623; --bad:#F16A6A;
    --solid:rgba(10,13,17,.85);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;color:var(--txt);font:15px/1.75 var(--sans);background:#0A0D11;
    text-shadow:0 1px 10px rgba(10,8,5,.55),0 0 2px rgba(10,8,5,.35)}

  /* 左侧竖排导航 dock */
  .dock{position:fixed;left:0;top:14px;z-index:60;
    display:flex;flex-direction:column;gap:2px;
    background:var(--solid);border:1px solid var(--line2);border-left:none;border-radius:0 14px 14px 0;
    padding:6px 4px 6px 2px;backdrop-filter:blur(4px);box-shadow:0 10px 34px rgba(0,0,0,.45)}
    .dock .brand{font:600 11px var(--mono);color:var(--acc);letter-spacing:.08em;text-align:center;
    padding:3px 6px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .dock button{display:flex;align-items:center;background:none;border:1px solid transparent;
    color:var(--mut);font:13px var(--sans);padding:7px 10px 7px 8px;border-radius:0 9px 9px 0;cursor:pointer;
    text-align:left;white-space:nowrap}
  .dock button.on{color:var(--acc);border-color:var(--line2);background:rgba(57,208,216,.1);font-weight:500}
  .dock button:hover{color:var(--txt)}

  /* HOLO 人物面板：左上角（站主指定） */
  .holo{position:fixed;right:14px;top:14px;z-index:55;width:284px;
    background:var(--panel);border:1px solid var(--line2);border-radius:14px;
    box-shadow:0 12px 40px rgba(0,0,0,.45);overflow:hidden;backdrop-filter:blur(4px)}
  .holo-hd{display:flex;align-items:center;gap:11px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .holo-av{width:72px;height:72px;flex:none;border-radius:10px;overflow:hidden;
    border:1px solid var(--line2);background:#E8ECEF;line-height:0}
    .holo-av canvas{width:72px;height:72px;display:block}
  .holo-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px}
  .holo-name .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}
  .holo-sub{font:10.5px var(--mono);color:var(--mut);margin-top:3px;letter-spacing:.07em}
  .holo-fold{margin-left:auto;background:none;border:1px solid var(--line);color:var(--mut);
    width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:11px;flex:none}
  .holo-say{padding:10px 12px;font-size:12.5px;min-height:52px;line-height:1.55;transition:opacity .15s}
  .holo-say .qk{color:var(--acc)}
  .holo-wf{display:flex;align-items:center;gap:10px;padding:0 12px 10px}
  .holo-wf .bars2{display:flex;align-items:flex-end;gap:2.5px;height:18px}
  .holo-wf .bars2 i{width:3px;background:var(--acc);border-radius:2px;height:5px}
  .holo.live .holo-wf .bars2 i{animation:wf .9s ease-in-out infinite}
  .holo.live .holo-wf .bars2 i:nth-child(2){animation-delay:.12s}
  .holo.live .holo-wf .bars2 i:nth-child(3){animation-delay:.24s}
  .holo.live .holo-wf .bars2 i:nth-child(4){animation-delay:.36s}
  .holo.live .holo-wf .bars2 i:nth-child(5){animation-delay:.48s}
  @keyframes wf{0%,100%{height:4px}50%{height:16px}}
  .holo-state{font:11px var(--mono);color:var(--acc);letter-spacing:.12em}
  .holo-ft{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--mut)}
  .holo-bubble{display:none;position:fixed;right:14px;top:14px;z-index:55;width:60px;height:60px;
    border-radius:50%;overflow:hidden;border:2px solid var(--acc);cursor:pointer;
    background:#E8ECEF;box-shadow:0 8px 24px rgba(0,0,0,.5);line-height:0}
  .holo-bubble canvas{width:60px;height:60px;display:block}
  body.holo-min .holo{display:none}
  body.holo-min .holo-bubble{display:block}


  /* 主区 */
  .main{margin:0 auto;padding:16px 344px 60px 88px;max-width:1520px}
  body:not(.is-home) .main{padding-top:14px}
  .pgtitle{font:600 21px var(--sans);letter-spacing:.01em}
  .pglead{color:var(--mut);font-size:13px;margin:4px 0 16px}
  .pglead .sync{font:11px var(--mono);color:var(--ok);margin-left:10px}
  .view{display:none}.view.on{display:block}

  /* 监测中心：一整块大屏幕 */
  .screen{background:var(--panel);border:1px solid var(--line2);border-radius:16px;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.45);backdrop-filter:blur(4px)}
  .screen-hd{display:flex;align-items:center;gap:10px;padding:11px 18px;flex-wrap:wrap;
    background:rgba(255,255,255,.03);border-bottom:1px solid var(--line)}
  .screen-hd .led{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}
  .screen-hd .t{font:600 13px var(--mono);letter-spacing:.1em}
  .screen-hd .sub{font:11px var(--mono);color:var(--mut)}
  .screen-hd .sync{margin-left:auto;font:12.5px var(--mono);color:var(--mut)}
  .screen-bd{padding:16px;display:flex;flex-direction:column;gap:14px}

  .mod{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .mod-hd{display:flex;align-items:center;gap:8px;padding:8px 13px;border-bottom:1px solid var(--line);
    font:12.5px var(--mono);color:var(--mut);letter-spacing:.09em}
  .mod-hd .led{width:6px;height:6px;border-radius:50%;background:var(--ok)}
  .mod-hd .tag{margin-left:auto;font-size:10.5px;color:var(--acc)}
  .mod-bd{padding:12px 13px}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .stat{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:rgba(255,255,255,.02)}
  body[data-skin="light"] .stat{background:rgba(255,255,255,.6)}
  .stat .n{font:600 25px var(--mono);color:var(--acc)}
  .stat .n em{font-style:normal;font-size:12px;color:var(--mut);margin-left:4px}
  .stat .l{font-size:12px;color:var(--mut);margin-top:2px}
  .grid23{display:grid;grid-template-columns:2fr 1fr;gap:14px}
  .grid32{display:grid;grid-template-columns:1fr 2fr;gap:14px}
  .grid22{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .row:last-child{border-bottom:0}
  .row .k{color:var(--mut);font-family:var(--mono);font-size:12px}
  .chip{display:inline-block;font:11px var(--mono);padding:1px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--acc)}
  .chip.bad{color:var(--bad);border-color:currentColor}
  .chip.warn{color:var(--warn);border-color:currentColor}
  .chip.ok{color:var(--ok);border-color:currentColor}
  .bars{display:flex;align-items:flex-end;gap:3px;height:64px;margin-top:6px}
  .bars i{flex:1;background:rgba(57,208,216,.55);border-radius:2px 2px 0 0;min-height:3px}
  .geo{list-style:none}
  .geo li{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
  .geo .cc{font:12px var(--mono);color:var(--acc);width:34px}
  .geo .bar{flex:1;height:6px;border-radius:3px;background:rgba(140,160,180,.18);overflow:hidden}
  .geo .bar i{display:block;height:100%;background:var(--acc2)}

  /* OPS-ROOM 作战室 */
  .ops-en{font-style:normal;color:var(--acc);opacity:.8;font-size:11px;margin-left:6px}
  .ops-tabs{display:flex;gap:4px;margin:0 auto;flex-wrap:wrap}
  .ops-tabs button{background:none;border:1px solid transparent;color:var(--mut);
    font:12.5px var(--mono);padding:5px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .ops-tabs button.on{color:var(--acc);border-color:var(--line2);background:rgba(127,212,216,.09)}
  .ops-tabs button:hover{color:var(--txt)}
  .ops-tab{display:none}
  .ops-tab.on{display:block;animation:opsfade .35s ease}
  @keyframes opsfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .ops-live{display:grid;grid-template-columns:1fr 296px;gap:14px;margin-bottom:14px}
  .term{background:#12100D;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
  .term-hd{display:flex;gap:10px;align-items:center;padding:8px 13px;border-bottom:1px solid var(--line);
    font:12.5px var(--mono);color:var(--txt)}
  .term-path{color:var(--mut);font-size:11px}
  .term-live{margin-left:auto;color:var(--ok);display:flex;align-items:center;gap:6px;font-size:11px}
  .term-live i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:blink 1.2s infinite}
  .term-bd{height:314px;overflow:hidden;padding:10px 13px;font:12px/1.9 var(--mono)}
  .tl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tl .ts{color:#8A8478}
  .tl .tg{font-weight:700;margin:0 2px}
  .tl .ssh{color:var(--bad)} .tl .scan{color:var(--warn)} .tl .web{color:var(--ok)}
  .tl .iot{color:var(--acc2)} .tl .smb{color:var(--acc2)} .tl .dns{color:var(--mut)}
  .tcursor{display:inline-block;width:7px;height:12px;background:var(--acc);animation:blink 1s steps(1) infinite;vertical-align:-1px}
  @keyframes blink{50%{opacity:.12}}
  .ops-rail{display:flex;flex-direction:column;gap:14px}
  .threat{display:flex;align-items:baseline;gap:12px}
  .threat .lv{font:700 22px var(--mono);color:var(--warn);white-space:nowrap}   /* ★第十二批：等级字不许被旁边的口径挤成两行 */
  .threat .trend{font:11px var(--mono);color:var(--bad)}
  .spark24{width:100%;height:56px;display:block}
  .graphwrap{position:relative}
  #atkGraph{width:100%;height:340px;display:block}
  .graph-legend{position:absolute;right:12px;top:8px;display:flex;gap:14px;font:11px var(--mono);color:var(--mut)}
  .lg{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
  .lg.red{background:var(--bad)} .lg.teal{background:var(--acc)} .lg.warn{background:var(--warn)}
  .lg.purp{background:var(--acc2)} .lg.ok{background:var(--ok)} .lg.dot{background:var(--warn)}
  .attk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .attk .cell{border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-height:76px;background:var(--panel2)}
  .attk .cell b{display:block;font:11px var(--sans);color:var(--mut);font-weight:400;margin-bottom:3px}
  .attk .cell .taid{font:9.5px var(--mono);color:#8A8478}
  .attk .cell .num{font:700 19px var(--mono);color:var(--txt);margin-top:4px}
  .attk .cell.hot{border-color:var(--line2)} .attk .cell.hot .num{color:var(--warn)}
  .attk .cell.fire .num{color:var(--bad)}
  .attk .cell.fire{animation:cellpulse 2.2s infinite}
  @keyframes cellpulse{50%{background:rgba(232,131,123,.12)}}
  .attk-note{margin-top:10px;font-size:12px;color:var(--mut)}
  .bars.anim i{animation:barGrow .7s cubic-bezier(.2,.8,.3,1) backwards;animation-delay:calc(var(--i)*30ms)}
  @keyframes barGrow{from{height:0}}
  .proto{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
  .donut{width:118px;height:118px;border-radius:50%;flex:none;position:relative;
    background:rgba(140,160,180,.18)}   /* ★第十二批：真值由 api-bind 从 /api/public/overview 写 inline conic-gradient */
  .donut::after{content:"";position:absolute;inset:24px;border-radius:50%;background:#12100D}
  .donut-c{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;font:12px var(--mono);color:var(--mut)}
  .proto-lg{list-style:none;font:12.5px var(--sans);color:var(--mut)}
  .proto-lg li{margin:5px 0}
  .proto-lg b{color:var(--txt);margin-left:10px;font-family:var(--mono)}

  /* AI 问答：纯对话 */
  .chatwrap{max-width:860px;margin:0 auto}
  .chat{background:var(--panel);border:1px solid var(--line2);border-radius:16px;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.45);backdrop-filter:blur(4px);
    display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:420px}
  .chat-hd{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
  .chat-hd .badge{font:12px var(--mono);color:var(--mut);display:flex;align-items:center;gap:6px}
  .chat-hd .badge .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .chat-hd .quota{margin-left:auto;font:11px var(--mono);color:var(--mut)}
  .chatlog{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:18px}
  .msg{max-width:82%;padding:11px 15px;border-radius:14px;font-size:14px;line-height:1.65}
  .msg.ai{align-self:flex-start;background:rgba(57,208,216,.08);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.me{align-self:flex-end;background:rgba(167,139,250,.13);border:1px solid rgba(167,139,250,.35);border-bottom-right-radius:4px}
  body[data-skin="light"] .msg.me{background:rgba(109,91,208,.1)}
  .msg .who{font:11px var(--mono);color:var(--mut);margin-bottom:5px}
  .msg .who .st{color:var(--acc)}
  .cite{margin-top:9px;border-left:2px solid var(--acc);padding:4px 10px;font-size:12px;color:var(--mut)}
  .chat-ft{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--line);background:var(--panel2)}
  .chat-ft input{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:99px;
    color:var(--txt);padding:10px 16px;font-size:13.5px;outline:none}
  body[data-skin="light"] .chat-ft input{background:#fff}
  .chat-ft input::placeholder{color:var(--mut)}
  .chat-ft input:focus{border-color:var(--acc)}
  .chat-ft button{background:var(--acc);border:0;color:#04282b;font-weight:600;padding:0 20px;border-radius:99px;cursor:pointer}
  .chat-note{text-align:center;font:11px var(--mono);color:var(--mut);padding:6px 0 0}

  /* AI 页手机：她活在手机里 */
  .ai-grid{display:grid;grid-template-columns:1fr 292px;gap:20px;max-width:1180px;margin:0 auto;align-items:start}
  .phone{width:292px;background:#0A0C0F;border:1px solid var(--line2);border-radius:38px;padding:12px;
    box-shadow:0 24px 70px rgba(0,0,0,.55)}
  .phone-scr{position:relative;border-radius:28px;overflow:hidden;background:
    radial-gradient(120% 60% at 50% 0%, #1B232E 0%, #12161D 70%);aspect-ratio:9/16.5}
  .phone-scr canvas{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;aspect-ratio:321/432}
  .phone-line .qk{color:var(--acc)}
  .phone-status{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;justify-content:space-between;
    padding:7px 14px;font:10.5px var(--mono);color:rgba(230,240,245,.85);
    background:linear-gradient(180deg,rgba(8,10,14,.55),transparent)}
  .phone-line{position:absolute;left:0;right:0;bottom:34px;z-index:2;padding:0 14px;font-size:12px;line-height:1.5;
    color:#EAF3F8;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.9)}
  .phone-live{position:absolute;left:0;right:0;bottom:10px;z-index:2;display:flex;align-items:center;justify-content:center;
    gap:7px;font:10px var(--mono);letter-spacing:.12em;color:var(--acc)}
  .phone-live .bars2{display:flex;align-items:flex-end;gap:2px;height:12px}
  .phone-live .bars2 i{width:2.5px;background:var(--acc);border-radius:2px;height:4px}
  .phone.live .phone-live .bars2 i{animation:wf .9s ease-in-out infinite}
  .phone.live .phone-live .bars2 i:nth-child(2){animation-delay:.12s}
  .phone.live .phone-live .bars2 i:nth-child(3){animation-delay:.24s}
  .phone.live .phone-live .bars2 i:nth-child(4){animation-delay:.36s}
  .phone.live .phone-live .bars2 i:nth-child(5){animation-delay:.48s}
  .phone-hint{margin-top:10px;text-align:center;font:11px var(--mono);color:var(--mut)}

  /* 手机样式四版（右下角选择器切换） */
  body[data-phone="v2"] .phone{background:#E8E4DC;border-color:rgba(60,55,48,.4)}
  body[data-phone="v2"] .phone-scr{border-radius:24px}
  body[data-phone="v3"] .phone{background:rgba(20,24,30,.35);border-color:rgba(127,212,216,.55);
    box-shadow:0 0 0 1px rgba(127,212,216,.25),0 24px 70px rgba(0,0,0,.45)}
  body[data-phone="v3"] .phone-scr{background:radial-gradient(120% 60% at 50% 0%, rgba(30,40,52,.85) 0%, rgba(14,18,24,.9) 70%)}
  body[data-phone="v4"] .phone{border-radius:12px;padding:8px}
  body[data-phone="v4"] .phone-scr{border-radius:6px;aspect-ratio:9/15}



  /* 笔记 / 靶场 / 关于 */
  .card{background:var(--panel);border:1px solid var(--line2);border-radius:14px;margin-bottom:16px;overflow:hidden;
    box-shadow:0 14px 44px rgba(0,0,0,.35);backdrop-filter:blur(4px)}
  .card-hd{display:flex;align-items:center;gap:8px;padding:9px 15px;border-bottom:1px solid var(--line);
    font:12.5px var(--mono);color:var(--mut);letter-spacing:.09em;background:var(--panel2)}
  .card-hd .led{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .card-bd{padding:14px 15px}
  .card-lead{padding:12px 15px 0;font-size:13px;color:var(--mut)}
  .card-lead b{color:var(--txt)}
  .note{display:flex;gap:14px;padding:13px 15px;border-bottom:1px dashed var(--line);cursor:pointer}
  .note:hover{background:rgba(57,208,216,.06)}
  .note .dt{font:11px var(--mono);color:var(--mut);width:86px;flex:none;padding-top:3px}
  .note .tt{font-size:14px;font-weight:500}
  .note .ds{font-size:12px;color:var(--mut);margin-top:2px}
  .verdict{border:1px solid var(--line2);border-radius:10px;padding:10px 14px;margin:12px 15px;
    display:flex;align-items:center;gap:10px;font-size:13px;background:rgba(245,166,35,.07)}
  .comp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 15px 10px;font-size:13px;background:rgba(255,255,255,.03)}
  body[data-skin="light"] .comp{background:rgba(255,255,255,.55)}
  .comp .hd{display:flex;align-items:center;gap:8px;font:12px var(--mono);color:var(--mut)}
  .comp .hd .sev{width:8px;height:8px;border-radius:50%}
  .comp p{color:var(--mut);font-size:12.5px;margin-top:5px}
  .anchor-row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
  .anchor-row a{font-size:12px;color:var(--mut);text-decoration:none;border:1px solid var(--line);
    padding:4px 12px;border-radius:99px;background:var(--panel)}
  .anchor-row a:hover{color:var(--acc)}
  ul.bl{list-style:none;padding:0 15px 14px}
  ul.bl li{padding:5px 0 5px 16px;position:relative;font-size:13px;color:var(--mut)}
