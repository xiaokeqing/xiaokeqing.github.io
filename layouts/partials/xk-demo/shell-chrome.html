{{- /* 外壳常驻件（逐字）：底图两层 / demo 标识条 / 左侧 .dock / HOLO 面板 / 背景选择器。
      唯一改动：.dock 的 <button data-v> → <a href="站点真路由">（样式值逐字，见 shell-style）。
      ★T27（2026-10-15 站主）：/labs/ 与 /about/ 两页已删 ⇒ dock 六项 → 四项（主页 / 监测中心 / AI 问答 / 笔记）。 */ -}}
{{- $v := .v -}}
<!-- ★底图两层（恢复自 docs/demo-内容页外壳.html:427 + :45-47）：内容页的暖玻璃面板需要照片底 -->
<div class="bg" aria-hidden="true"></div>
<div class="bglite" aria-hidden="true"></div>
<div class="bgshade" aria-hidden="true"></div>

<!-- 左侧竖排导航 -->
<nav class="dock" id="dock" aria-label="站点导航（演示）">
  <div class="brand">XK-LAB</div>
  <a href="/" class="{{ if eq $v "home" }}on{{ end }}">主页</a>
  <a href="/alerts/" class="{{ if eq $v "monitor" }}on{{ end }}">监测中心</a>
  <a href="/ai/" class="{{ if eq $v "ai" }}on{{ end }}">AI 问答</a>
  <a href="/posts/" class="{{ if eq $v "notes" }}on{{ end }}">笔记</a>
  <a href="/test/" class="{{ if eq $v "test" }}on{{ end }}">测试</a>
    </nav>

<!-- HOLO 人物面板：左上角 -->
<aside class="holo live" id="holo" role="complementary" aria-label="助手面板（演示）">
  <div class="holo-hd">
    <div class="holo-av"><canvas id="avCanvas" width="132" height="132" aria-hidden="true"></canvas></div>
    <div>
      <div class="holo-name"><span class="dot"></span>桐莉栖</div>
      <div class="holo-sub">HOLO-LINK · TEXT ONLY</div>
    </div>
    <button class="holo-fold" id="holoFold" aria-label="折叠面板" title="折叠为头像泡">—</button>
  </div>
  <div class="holo-say" id="holoSay" aria-live="polite">公开只读端点汇总：护栏拦下 <span class="qk">—</span> 个动作，蜜罐累计事件 <span class="qk">—</span> 条。明细都在「监测中心」的大屏里。</div>
  <div class="holo-wf">
    <div class="bars2"><i></i><i></i><i></i><i></i><i></i></div>
    <span class="holo-state" id="holoState">SPEAKING</span>
  </div>
  <div class="holo-ft">
    <span>语音未启用</span>
  </div>
</aside>
<div class="holo-bubble" id="holoBubble" title="展开面板"><canvas id="bubbleCanvas" width="132" height="132"></canvas></div>
