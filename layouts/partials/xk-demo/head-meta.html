{{- /* 不可见契约：Hugo 的 head（标题/描述/canonical/OG/favicon）。
       demo 文件自己的 <head> 只有 charset+viewport+title+<style>；这一份补上站点既有的 SEO 字段，
       其余一个字节都不加。 */ -}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{- /* ★2026-11-04 晚 站主口径：**按网速分档，不按设备分档**（他电脑是限速校园网、手机流量反而快）。
       这一段在 CSS 之前同步跑：测到慢网就给 <html> 挂 xk-slow，样式表里所有"慢网省流"的规则
       都挂在这个类上（不下背景照片、不显示光束层）。只读不发请求，约 200 字节。 */}}
<script>(function(){try{var c=navigator.connection||{},et=String(c.effectiveType||""),q=String(location.search);
if(q.indexOf("xk-net=fast")>=0){return;}
var slow=!!c.saveData||et==="slow-2g"||et==="2g"||(typeof c.downlink==="number"&&c.downlink>0&&c.downlink<2);
if(q.indexOf("xk-net=slow")>=0){slow=true;}
if(slow){document.documentElement.classList.add("xk-slow");}}catch(e){}})();</script>
{{- /* ★2026-11-08 站主口径（/ai/ 一进来先看到 Sprite 图集版人物）：
       E-mote ready 之前不要把 Sprite/poster 画上手机屏。这里在 CSS 之前同步挂
       xk-phone-emote-wait（CSS 把 .phone-scr 的 idle.poster.webp 垫底撤掉，只留纯色），
       条件与 xk-shell.js 里 E-mote 的挂载闸门同一套；ready/失败/8s 超时由页面脚本摘掉。
       为什么放 head：poster 是 CSS 背景，等 DOM/脚本再摘会先闪一帧白大褂。
       9000ms 是防「xk-shell.js 没加载」的保险丝（正常路径 8s 由 xk-shell.js 摘）。 */}}
<script>(function(){try{
var p=String(location.pathname||"");
if(p.indexOf("/ai/")!==0) return;
var q=String(location.search||"");
if(q.indexOf("xk-phone-emote=off")>=0||q.indexOf("xk-kurisu=off")>=0||q.indexOf("xk-no-kurisu=1")>=0) return;
if((window.innerWidth||0)<1280) return;
if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches) return;
var mem=navigator.deviceMemory||0, cores=navigator.hardwareConcurrency||0;
if(mem&&mem<8) return;
if(cores&&cores<4) return;
document.documentElement.classList.add("xk-phone-emote-wait");
setTimeout(function(){
  if(!document.documentElement.classList.contains("xk-emote-ready")){
    document.documentElement.classList.remove("xk-phone-emote-wait");
  }
},9000);
}catch(e){}})();</script>
{{- $desc := .Description | default site.Params.description -}}
{{- $ogTitle := cond .IsHome "xiaokeqing · 公网安全观测站" .Title -}}
{{- /* ★2026-11-08：分享图改成专门的 1200×630 / 112KB JPEG（scripts/gen-og-image.py 生成），
       不再指向 3245×1440 / 674,601 B 的 bg.jpg —— 社交平台抓图不再拖 659KB，裁切也不再切脸。 */ -}}
{{- $ogImgPath := "/images/og-1200x630.jpg" -}}
{{- with .Params.images }}{{ $ogImgPath = index . 0 }}{{ end -}}
{{- $ogImg := $ogImgPath | absURL -}}
{{- /* ★2026-11-07 PWA：可安装 + 离线壳（static/manifest.webmanifest、static/sw.js）。只注册，不预缓存大资产。 */ -}}
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a1013">
<title>{{ if .IsHome }}xiaokeqing · 公网安全观测站{{ else }}{{ .Title }} · xiaokeqing{{ end }}</title>
<meta name="description" content="{{ $desc }}">
<meta name="robots" content="{{ if in (slice "demo" "test") .Section }}noindex, nofollow{{ else }}index, follow{{ end }}">
<meta name="author" content="{{ site.Params.author }}">
<meta name="color-scheme" content="dark">
{{ hugo.Generator }}
<meta name="wb-api" content="{{ site.Params.wbApiBase | default "https://demo.xiaokeqing.cn" }}">
{{/* ★2026-11-07 晚：数据面改「同源静态快照优先」。
     原因：demo.xiaokeqing.cn 那条 CF 隧道对大响应吞吐掉到 ~600 B/s（home.js 36KB 60s 只收到 3KB），
     数据页因此长时间转圈。快照由 scripts/snapshot-api.ps1 定期从 srv1/srv2 侧抓下来，落在 static/api/public/ 下，
     与线上端点同路径 ⇒ 页面把 wb-api 清空即改读同源静态 JSON（秒开）。
     想临时用实时接口：URL 加 ?live=1。
     ★2026-11-08：清空前把原值抄一份到 <html data-wb-api>。问答（/ai/）和 SSE（/alerts/）没有静态快照可用，
     只能打后端，所以它们回退到这份原值；其余只读数据页仍读同源快照。
     ★2026-11-08 晚：原来这里是两个内联 <script>（SW 注册 + wb-api 抄写），合并成一个 ——
     首页 <script> 总数 12 → 8；两段互不依赖，合并后执行点不变（都在 meta wb-api 之后、解析 <body> 之前）。 */}}
<script>(function(){function sw(){try{if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){});}}catch(e){}}
if(document.readyState==='complete'){setTimeout(sw,1800);}else{addEventListener('load',function(){setTimeout(sw,1800);});}
try{var m=document.querySelector('meta[name="wb-api"]');if(m){var v=m.getAttribute('content')||'';
if(v){document.documentElement.setAttribute('data-wb-api',v);}
if(location.search.indexOf('live=1')<0){m.setAttribute('content','');}}}catch(e){}})();</script>
{{- /* ★P（2026-10-18）：只给"真的会打 demo API"的页面做 preconnect —— 首页/监测中心/状态页/接口页。
       其余页面（文章、靶场、介绍）一次都不会连 demo.xiaokeqing.cn，给它们 preconnect 只是白付一次 TLS 握手。
       crossorigin 必须写：API 请求是 CORS 模式，不带它的 preconnect 会另开一条"非 CORS"连接，等于没做。
       ⚠ 这一份 HEAD_META 是 layouts/partials/xk-demo/head-meta.html 的**源头**：
       直接改那个 partial 会在下次跑 gen-demo-pages.py 时被覆盖（2026-10-18 踩过）。 */ -}}
{{- $apiBase := site.Params.wbApiBase | default "https://demo.xiaokeqing.cn" -}}
{{- if or .IsHome (in (slice "alerts" "status" "api") .Type) }}
<link rel="preconnect" href="{{ $apiBase }}" crossorigin>
<link rel="dns-prefetch" href="{{ $apiBase }}">
{{- /* ★巡检（2026-10-18）：首屏就去取的 home 聚合，让请求在解析到 <script>/app.js 之前先开始。
       crossorigin 必须写：与 preconnect 同理，fetch 是 CORS 模式，不带它会按"非 CORS"再来一次。
       只给这四个页面加（同一条件块）：文章页/靶场/介绍页不取 home 聚合，加了只会白下一份。 */}}
<link rel="preload" as="fetch" href="{{ $apiBase }}/api/public/home.js" crossorigin>
{{- end }}
<link rel="icon" type="image/png" sizes="128x128" href="/favicon-128.png">
<link rel="apple-touch-icon" sizes="256x256" href="/favicon-256.png">
<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ $ogTitle }}">
<meta property="og:description" content="{{ $desc }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ site.Title }}">
<meta property="og:locale" content="zh_CN">
<meta property="og:image" content="{{ $ogImg }}">
{{- /* 默认分享图是 1200×630；页面自定义 images 时不再写死宽高（尺寸未知）。 */}}
{{- if not .Params.images }}
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="XK-LAB 公网安全观测站：24h 告警 78,130 条 · 27 条攻防用例 · 41 个只读端点">
{{- end }}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ $ogTitle }}">
<meta name="twitter:description" content="{{ $desc }}">
<meta name="twitter:image" content="{{ $ogImg }}">
{{- /* ★2026-11-08 首屏脚本收口（12 → 8）：ux（命令面板 / 阅读进度 / 复制按钮）、
       geo（攻击地理热力）、ticker（顶栏实时攻击轮播）三个独立 IIFE 合成一个指纹文件。
       行为不变：都是 defer、都在 DOM 解析完后按序执行；ticker 自己会判 html.xk-slow 与 #dockTicker。 */ -}}
{{- $uxBundle := slice (resources.Get "js/xk-ux.js") (resources.Get "js/xk-geo.js") (resources.Get "js/xk-ticker.js") | resources.Concat "js/xk-ux-geo-ticker.js" | minify | fingerprint -}}
<script src="{{ $uxBundle.RelPermalink }}" defer></script>
