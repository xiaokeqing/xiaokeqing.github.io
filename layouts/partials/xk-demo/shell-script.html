{{- /* 外壳的两段内联 <script> 逐字（切 view / 作战室 / 聊天 / 靶场演示 / 雪碧条播放器 / CRT 场景）。
      改动只有两类：① 素材路径 ② 站主第四批口径③允许的"行为级懒加载"（只改加载时机）。
      ↓ 懒加载的逐条说明（Hugo 注释，不进产物；**别把它写成 JS 注释留在 <script> 外面** ——
        那样会被当正文渲染出来，本轮踩过：像素差从 0.44% 弹到 3.59%）：
  /* ★ 生产站差异（站主第四批口径③"允许行为级懒加载，不许改版式"）：下面这几处**只改加载时机**，
     渲染逻辑/数值/结构逐字未动 —— 见 _dev/gen-demo-pages.py 的 LAZY_PATCHES。
       · v-home 的 4 张场景图加 loading="lazy"（五个内容页上 v-home 是 display:none，不进首屏）
       · 背景选择器 10 张缩略图加 loading="lazy"（在关着的弹层里）；当前背景仍立刻载
       · 头像泡（折叠后才显示）与"面板/手机各自不可见时"的图集不载；可见的那一份照 demo 立刻载
     判据：对拍像素差不变（_shots/demopage-*-side.png）+ 五页首屏回到 ≤1600KB。
  * /
 */ -}}
<script>
/* ============ 背景选择器 ============ */
const BGS = [
  {id:'room_empty',    name:'空实验室',   file:'/kurisu/scene/bg/room_empty.webp'},
  {id:'room_computer', name:'电脑前',     file:'/kurisu/scene/bg/room_computer.webp'},
  {id:'room_sleep',    name:'趴桌睡',     file:'/kurisu/scene/bg/room_sleep.webp'},
  {id:'room_crt',      name:'贴脸看屏',   file:'/kurisu/scene/bg/room_crt.webp'},
  {id:'room_coffee',   name:'喝咖啡',     file:'/kurisu/scene/bg/room_coffee.webp'},
  {id:'room_thinking', name:'站着想事',   file:'/kurisu/scene/bg/room_thinking.webp'},
  {id:'room_whiteboard',name:'白板前',    file:'/kurisu/scene/bg/room_whiteboard.webp'},
  {id:'desk',          name:'书桌(主页)', file:'/images/crt/desk.webp'},
  {id:'light_high',    name:'光束·强',    file:'/kurisu/scene/bg/light_high.webp'},
  {id:'light_low',     name:'光束·弱',    file:'/kurisu/scene/bg/light_low.webp'},
];
const bgEl = document.getElementById('bgEl');
const bgGrid = document.getElementById('bgGrid');
BGS.forEach(b=>{
  const btn = document.createElement('button');
  btn.className = 'bgopt'; btn.dataset.id = b.id; btn.title = b.name;
  btn.innerHTML = `<img loading="lazy" src="${b.file}" alt="${b.name}"><span>${b.name}</span>`;
  btn.onclick = ()=>setBg(b.id, true);
  bgGrid.appendChild(btn);
});
function setBg(id, save){
  const b = BGS.find(x=>x.id===id) || BGS[0];
  bgEl.style.backgroundImage = `url(${b.file})`;
  document.querySelectorAll('.bgopt').forEach(o=>o.classList.toggle('on', o.dataset.id===b.id));
  if(save) localStorage.setItem('xk-demo-bg4', b.id);
}
setBg(localStorage.getItem('xk-demo-bg4') || 'room_empty', false);

const shadeRange = document.getElementById('shadeRange');
function setShade(v, save){
  document.documentElement.style.setProperty('--shade', (v/100).toFixed(2));
  if(save) localStorage.setItem('xk-demo-shade4', v);
}
shadeRange.value = localStorage.getItem('xk-demo-shade4') || 8;
setShade(+shadeRange.value, false);
shadeRange.oninput = ()=>setShade(+shadeRange.value, true);

document.querySelectorAll('.skin-toggle button').forEach(b=>b.onclick = ()=>{
  document.body.dataset.skin = b.dataset.skin;
  document.querySelectorAll('.skin-toggle button').forEach(x=>x.classList.toggle('on', x===b));
  localStorage.setItem('xk-demo-skin4', b.dataset.skin);
});
const savedSkin = localStorage.getItem('xk-demo-skin4') || 'warm';
document.body.dataset.skin = savedSkin;
document.querySelectorAll('.skin-toggle button').forEach(x=>x.classList.toggle('on', x.dataset.skin===savedSkin));

document.getElementById('bgBtn').onclick = ()=>document.getElementById('bgPicker').classList.toggle('open');
/* 手机样式切换 */
document.querySelectorAll('[data-phone]').forEach(b=>b.onclick = ()=>{
  document.body.dataset.phone = b.dataset.phone;
  document.querySelectorAll('[data-phone]').forEach(x=>x.classList.toggle('on', x===b));
  localStorage.setItem('xk-demo-phone4', b.dataset.phone);
});
const savedPhone = localStorage.getItem('xk-demo-phone4') || 'v1';
document.body.dataset.phone = savedPhone;
document.querySelectorAll('[data-phone]').forEach(x=>x.classList.toggle('on', x.dataset.phone===savedPhone));

/* ============ 雪碧条播放器 ============ */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============ OPS-ROOM 作战室 ============ */
const opsTabs = document.querySelectorAll('#opsTabs button');
const opsPanes = document.querySelectorAll('.ops-tab');
let opsTab = 'live';
opsTabs.forEach(b=>b.onclick = ()=>{
  opsTab = b.dataset.tab;
  opsTabs.forEach(x=>x.classList.toggle('on', x===b));
  opsPanes.forEach(p=>p.classList.toggle('on', p.dataset.pane===opsTab));
  if(opsTab==='graph'){ startGraph(); runCounters(); }   /* ★第十二批：这四个数字渲染在 graph 这一屏，
      原来只在点 stats 时滚动 → 它们永远停在 0（demo 的错位）。 */
  if(opsTab==='stats') drawSpark();
  if(opsTab==='live') drawSpark();
});

/* 实时攻击流 —— ★第十二批重写（站主：①不许假数字 ②修"行叠行"）
   数据：/api/public/alerts 的真实聚合告警，由 api-bind 写进 window.XK_FEED 后调 __xkRenderFeed。
   行数：按容器高度实算（原来是"最多 12 行 + 光标一行"= 13 个行盒塞进 12.89 行的容器，
        最后一行被 overflow 切掉 2.4px —— 实测 scrollHeight 316 > clientHeight 314）。
        现在行数 = floor((容器高 - 上下 padding) / 行高) - 1（减 1 给光标），行与行永不重叠、末行不被切。 */
const termFeed = document.getElementById('termFeed');
const xkEsc = s=>String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const tcursor = document.createElement('div');
tcursor.innerHTML = '<span class="tcursor"></span>';
let feedSeen = {};
function feedCap(){
  const lh = parseFloat(getComputedStyle(termFeed).lineHeight) || 22.8;
  return Math.max(2, Math.floor((termFeed.clientHeight - 20) / lh) - 1);
}
function feedRow(it){
  const el = document.createElement('div');
  el.className = 'tl';
  el.innerHTML = `<span class="ts">${xkEsc(it.ts)}</span> <span class="tg ${it.cls}">${xkEsc(it.tag)}</span> ${xkEsc(it.text)}`;
  termFeed.appendChild(el);
}
function feedTrim(){
  const cap = feedCap();
  while(termFeed.querySelectorAll('.tl').length > cap) termFeed.removeChild(termFeed.querySelector('.tl'));
  termFeed.appendChild(tcursor);
}
function renderFeed(){
  const items = window.XK_FEED;
  if(!items){
    termFeed.innerHTML = '';
    feedRow({ts:'--:--:--', cls:'dns', tag:'[读不到]', text:'/api/public/alerts 本次取不到（不可达或被拦）—— 不补样例值'});
    feedTrim();
    return;
  }
  if(!items.length){
    termFeed.innerHTML = '';
    feedRow({ts:'--:--:--', cls:'dns', tag:'[空]', text:'/api/public/alerts 返回的聚合窗口里没有告警（不是取不到，是真的没有）'});
    feedTrim();
    return;
  }
  items.filter(it=>!feedSeen[it.key]).forEach(it=>{ feedSeen[it.key] = 1; feedRow(it); });
  feedTrim();
}
window.__xkRenderFeed = renderFeed;
addEventListener('resize', feedTrim);


/* 24 小时攻击时序 —— ★第十二批重写：数据改成 /api/public/alerts 的 stats24h.trend
   （25 个小时桶真实计数，由 api-bind 写进 window.XK24H）；取不到就清空画布 + 表头写"读不到"，
   不再用 Math.sin + 取模画一条看着像波形的假曲线（原实现就是这么画的）。 */
let sparkDone = false;
function drawSpark(){
  const c = document.getElementById('spark24'); if(!c) return;
  const h = 56, dpr = Math.min(devicePixelRatio||1, 2), w = c.clientWidth;
  if(!w) return;
  c.width = w*dpr; c.height = h*dpr;
  const x = c.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,h);
  const bins = window.XK24H || null;
  const mod = c.closest('.mod');
  const tag = mod ? mod.querySelector('.mod-hd .tag') : null;
  if(!bins || bins.length < 2){
    if(tag) tag.textContent = '读不到（/alerts · stats24h）';
    return;
  }
  if(tag) tag.textContent = '/alerts · stats24h（' + bins.length + ' 个小时桶）';
  const vals = bins.map(b=>Number(b.count)||0);
  const max = Math.max.apply(null, vals) || 1;
  const yOf = v => (h-8) - (h-16) * (v/max);
  const area = ()=>{
    x.beginPath(); x.moveTo(0,h);
    vals.forEach((v,i)=>x.lineTo(i/(vals.length-1)*w, yOf(v)));
    x.lineTo(w,h); x.closePath();
    x.fillStyle = 'rgba(127,212,216,.10)'; x.fill();
  };
  const line = upto=>{
    x.beginPath();
    const n = Math.max(2, Math.ceil(vals.length*upto));
    for(let i=0;i<n;i++){ const px = i/(vals.length-1)*w; i===0 ? x.moveTo(px,yOf(vals[i])) : x.lineTo(px,yOf(vals[i])); }
    x.strokeStyle = '#7FD4D8'; x.lineWidth = 1.6; x.stroke();
  };
  area();
  if(RM || sparkDone){ line(1); return; }
  sparkDone = true;
  const t0 = performance.now(), dur = 1100;
  (function step(t){
    const k = Math.min(1,(t-t0)/dur);
    x.clearRect(0,0,w,h); area(); line(k);
    if(k<1) requestAnimationFrame(step);
  })(t0);
}
window.__xkSpark = drawSpark;
drawSpark();


/* 攻击图谱：攻击者 → 传感器，数据包流动动画 */
/* ★第十二批：攻击者与传感器不再是写死的样例 ——
   由 api-bind 从 /api/public/alerts（真实来源 IP）与 /api/public/honeypot（真实 SSH 客户端指纹）
   写进 window.XK_ATTACKERS / window.XK_SENSORS；取不到就只画一行「读不到」，不画假的攻击路径。 */
const SENSORS = [];
const ATTACKERS = [];
let graphStarted = false;
function startGraph(){
  const c = document.getElementById('atkGraph'); if(!c || graphStarted) return;
  graphStarted = true;
  const dpr = Math.min(devicePixelRatio||1, 2);
  const x = c.getContext('2d');
  let hits = null;
  let W = 0, H = 340;
  const resize = ()=>{ W = c.clientWidth; c.width = W*dpr; c.height = H*dpr; x.setTransform(dpr,0,0,dpr,0,0); };
  resize(); addEventListener('resize', resize);
  const A_NAMES = window.XK_ATTACKERS || [], S_NAMES = window.XK_SENSORS || [];
  if(!A_NAMES.length || !S_NAMES.length){   /* 读不到：把原因画在同一块画布上，不画假的路径 */
    graphStarted = false;   /* 不锁死：数据到了以后再点这一栏还能画 */
    const note = ()=>{ const w2 = c.clientWidth; if(!w2) return; x.clearRect(0,0,w2,H);
      x.fillStyle = 'rgba(210,203,189,.75)'; x.font = '12px ui-monospace,Consolas,monospace'; x.textAlign = 'center';
      x.fillText(window.XK_GRAPH_NOTE || '读不到：攻击路径的数据源没取到 —— 不画假的路径', w2/2, H/2); };
    note(); addEventListener('resize', note); return;
  }
  hits = S_NAMES.map(()=>0);
  const A = A_NAMES.map((n,i)=>({n, fx:.09, fy:(i+1)/(A_NAMES.length+1)}));
  const S = S_NAMES.map((s,i)=>({n:s[0], d:s[1], fx:.82, fy:(i+1)/(S_NAMES.length+1)}));
  let pk = [], last = 0;
  function frame(t){
    requestAnimationFrame(frame);
    if(opsTab!=='graph' || !document.getElementById('v-monitor').classList.contains('on') || !W) return;
    x.clearRect(0,0,W,H);
    x.font = '11px ui-monospace,Consolas,monospace';
    const pos = n=>({x:n.fx*W, y:26+n.fy*(H-60)});
    S.forEach(s=>{ const p = pos(s); x.textAlign='right'; x.fillStyle='rgba(210,203,189,.35)'; x.fillText(s.d, p.x-16, p.y+3); });
    if(!RM && t-last > 420 && pk.length < 22){ last = t; pk.push({a:(Math.random()*A.length)|0, s:(Math.random()*S.length)|0, k:0, sp:.006+Math.random()*.009}); }
    x.lineWidth = 1;
    pk.forEach(p=>{
      const pa = pos(A[p.a]), ps = pos(S[p.s]);
      x.strokeStyle = 'rgba(210,203,189,.05)';
      x.beginPath(); x.moveTo(pa.x,pa.y); x.lineTo(ps.x,ps.y); x.stroke();
    });
    pk = pk.filter(p=>{
      p.k += p.sp;
      const pa = pos(A[p.a]), ps = pos(S[p.s]);
      const px = pa.x+(ps.x-pa.x)*p.k, py = pa.y+(ps.y-pa.y)*p.k;
      for(let j=0;j<5;j++){
        const q = p.k - j*.02;
        if(q<0) break;
        x.fillStyle = `rgba(232,180,90,${.85-j*.16})`;
        x.beginPath(); x.arc(pa.x+(ps.x-pa.x)*q, pa.y+(ps.y-pa.y)*q, 2.6-j*.35, 0, 7); x.fill();
      }
      if(p.k>=1){ hits[p.s]++; return false; }
      return true;
    });
    A.forEach(a=>{
      const p = pos(a);
      x.fillStyle = '#E8837B'; x.beginPath(); x.arc(p.x,p.y,5,0,7); x.fill();
      x.fillStyle = 'rgba(210,203,189,.85)'; x.textAlign='left'; x.fillText(a.n, p.x+12, p.y+3);
    });
    S.forEach((s,i)=>{
      const p = pos(s);
      x.fillStyle = '#7FD4D8'; x.beginPath(); x.arc(p.x,p.y,6,0,7); x.fill();
      x.fillStyle = 'rgba(127,212,216,.25)'; x.beginPath(); x.arc(p.x,p.y,10+Math.sin(t/300+i)*2,0,7); x.fill();
      x.fillStyle = '#7FD4D8'; x.textAlign='left'; x.fillText(s.n, p.x+14, p.y-2);
      x.fillStyle = 'rgba(210,203,189,.8)'; x.fillText(String(hits[i]), p.x+14, p.y+11);
    });
  }
  requestAnimationFrame(frame);
}

/* 告警类型矩阵 —— ★第十二批重写（原来是写死的 TACTIC_HITS 样例值）。
   服务端没有 ATT&CK 战术字段，所以这里一格 = 服务端真实给的一个类型标签 + /alerts 的
   stats.byType 真实计数；映射关系由服务端给，前端不编。取不到就写"读不到"。 */
const attkGrid = document.getElementById('attkGrid');
function renderTypes(){
  if(!attkGrid) return;
  const rows = window.XK_TYPES;
  attkGrid.innerHTML = '';
  if(!rows || !rows.length){
    attkGrid.innerHTML = '<div class="cell"><b>读不到</b><span class="taid">/api/public/alerts</span><div class="num">—</div></div>';
    return;
  }
  const max = Math.max.apply(null, rows.map(r=>Number(r.count)||0)) || 1;
  rows.forEach((r,i)=>{
    const hit = Number(r.count) || 0;
    const cell = document.createElement('div');
    cell.className = 'cell' + (hit/max >= .6 ? ' fire' : hit>0 ? ' hot' : '');
    cell.innerHTML = `<b>${xkEsc(r.label || r.key || '—')}</b><span class="taid">${xkEsc(r.key || '')}</span>` +
      `<div class="num">${hit.toLocaleString('en-US')}</div>`;
    attkGrid.appendChild(cell);
  });
}
window.__xkRenderTypes = renderTypes;

/* 数据统计：数字滚动 */
let counted = false;
function runCounters(){
  counted = true;
  /* ★第十二批：data-count 为空 = 该数字这次没取到 → 写"读不到"，**不写 0 冒充**；
     真值由 api-bind 从真实端点写进 data-count 与文本。 */
  document.querySelectorAll('[data-count]').forEach(el=>{
    const raw = el.dataset.count, T = Number(raw);
    if(raw === '' || raw === undefined || !isFinite(T)){ el.textContent = '读不到'; return; }
    if(RM){ el.textContent = T.toLocaleString('en-US'); return; }
    const t0 = performance.now(), dur = 900;
    (function step(t){
      const k = Math.min(1,(t-t0)/dur);
      el.textContent = Math.round(T*(1-Math.pow(1-k,3))).toLocaleString('en-US');
      if(k<1) requestAnimationFrame(step);
    })(t0);
  });
}
const CELL = 132, COLS = 8;
const EMOS = {
  normal:         {idle:'/kurisu/avatar/normal.idle.webp',         speaking:'/kurisu/avatar/normal.speaking.webp'},
  happy:          {idle:'/kurisu/avatar/happy.idle.webp',          speaking:'/kurisu/avatar/happy.speaking.webp'},
  sided_thinking: {idle:'/kurisu/avatar/sided_thinking.idle.webp', speaking:'/kurisu/avatar/sided_thinking.speaking.webp'},
  sad:            {idle:'/kurisu/avatar/sad.static.webp',          speaking:'/kurisu/avatar/sad.static.webp'},
  blush:          {idle:'/kurisu/avatar/blush.static.webp',        speaking:'/kurisu/avatar/blush.static.webp'}
};
function makePlayer(canvas){
  const ctx = canvas.getContext('2d');
  const cache = {};
  let cur = null, frames = 0, fi = 0, last = 0;
  function img(src){ if(!cache[src]){ const im = new Image(); im.src = src; cache[src] = im; } return cache[src]; }
  function set(src){
    if(cur === src) return;
    cur = src; fi = 0;
    const im = img(src);
    const ready = ()=>{ if(cur !== src) return;
      frames = (im.naturalWidth === CELL && im.naturalHeight === CELL)
        ? 1 : COLS * Math.floor(im.naturalHeight / CELL);
      draw(0); };
    (im.complete && im.naturalWidth) ? ready() : (im.onload = ready);
  }
  function draw(i){
    const im = img(cur);
    if(!im.complete || !im.naturalWidth) return;
    ctx.clearRect(0, 0, CELL, CELL);
    if(frames <= 1){ ctx.drawImage(im, 0, 0); return; }
    ctx.drawImage(im, (i % COLS) * CELL, Math.floor(i / COLS) * CELL, CELL, CELL, 0, 0, CELL, CELL);
  }
  function tick(t){
    if(cur && frames > 1 && !RM && t - last > 90){ fi = (fi + 1) % frames; draw(fi); last = t; }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  return { set };
}
const panelAv  = makePlayer(document.getElementById('avCanvas'));
const bubbleAv = makePlayer(document.getElementById('bubbleCanvas'));
/* 手机里的她：用人物包（full/）全身剪辑，与 CRT 同源 */
const BODY = {
  idle:     {src:'/kurisu/full/idle.hi.webp',     frames:60, interval:42},
  speaking: {src:'/kurisu/full/speaking.hi.webp', frames:90, interval:34},
  thinking: {src:'/kurisu/full/thinking.hi.webp', frames:90, interval:34}
};
function makeBodyPlayer(canvas){
  const ctx = canvas.getContext('2d');
  canvas.width = 321; canvas.height = 432;
  const CW = 321, CH = 432, COLS = 8;
  const cache = {};
  let cur = null, frames = 0, fi = 0, last = 0, iv = 42;
  function img(src){ if(!cache[src]){ const im = new Image(); im.src = src; cache[src] = im; } return cache[src]; }
  function set(clip){
    if(cur === clip.src) return;
    cur = clip.src; frames = clip.frames; iv = clip.interval; fi = 0;
    const im = img(cur);
    const ready = ()=>{ if(cur !== clip.src) return; draw(0); };
    (im.complete && im.naturalWidth) ? ready() : (im.onload = ready);
  }
  function draw(i){
    const im = img(cur);
    if(!im.complete || !im.naturalWidth) return;
    ctx.clearRect(0, 0, CW, CH);
    ctx.drawImage(im, (i % COLS) * CW, Math.floor(i / COLS) * CH, CW, CH, 0, 0, CW, CH);
  }
  function tick(t){
    if(cur && frames > 1 && !RM && t - last > iv){ fi = (fi + 1) % frames; draw(fi); last = t; }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  return { set };
}
const phoneBody = makeBodyPlayer(document.getElementById('phoneCanvas'));
const phoneAv  = null; // 手机用全身播放器，见 phoneBody
const phoneEl  = document.getElementById('phone');
const phoneLineEl = document.getElementById('phoneLine');
const phoneStateEl = document.getElementById('phoneState');
/* 手机时间（演示用真实时钟） */
function tickClock(){ const d=new Date();
  document.getElementById('phoneClock').textContent = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
tickClock(); setInterval(tickClock, 20000);

/* ============ 面板状态 ============ */
const holo = document.getElementById('holo');
const stateEl = document.getElementById('holoState');
const sayEl = document.getElementById('holoSay');
let emo = 'normal', mode = 'speaking', speakTimer = null;
function render(){
  const strip = EMOS[emo][mode === 'speaking' ? 'speaking' : 'idle'];
  if(!document.body.classList.contains('is-ai')) panelAv.set(strip);
  if(document.body.classList.contains('holo-min')) bubbleAv.set(EMOS[emo].idle);
  if(document.getElementById('v-ai').classList.contains('on')) phoneBody.set(BODY[mode === 'speaking' ? 'speaking' : (emo === 'sided_thinking' ? 'thinking' : 'idle')]);
  const label = mode === 'speaking' ? 'SPEAKING' : (emo === 'sided_thinking' ? 'THINKING' : 'IDLE');
  stateEl.textContent = label;
  phoneStateEl.textContent = label;
  holo.classList.toggle('live', mode === 'speaking' && !RM);
  phoneEl.classList.toggle('live', mode === 'speaking' && !RM);
}
function speak(html){
  sayEl.style.opacity = 0;
  phoneLineEl.style.opacity = 0;
  setTimeout(()=>{ sayEl.innerHTML = html; sayEl.style.opacity = 1;
    phoneLineEl.innerHTML = html; phoneLineEl.style.opacity = 1; }, 150);
  mode = 'speaking'; render();
  clearTimeout(speakTimer);
  speakTimer = setTimeout(()=>{ mode = 'idle'; render(); }, 2600);
}
render();
setTimeout(()=>{ mode = 'idle'; render(); }, 2600);
document.getElementById('holoFold').onclick = ()=>{ document.body.classList.add('holo-min'); render(); };
document.getElementById('holoBubble').onclick = ()=>document.body.classList.remove('holo-min');
document.querySelectorAll('#emos b').forEach(b=>b.onclick = ()=>{
  document.querySelectorAll('#emos b').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); emo = b.dataset.emo; mode = 'idle'; render();
});

/* ============ 页面切换 ============ */
const views = {home:'v-home', monitor:'v-monitor', ai:'v-ai', notes:'v-notes', range:'v-range', about:'v-about'};
const SAYS = {
  home:'',
  monitor:'公开只读端点的实时汇总都在这一屏；取不到就写读不到，不补数。',
  ai:'有什么安全问题直接问我。答不了就说答不了。',
  notes:'这几篇都是真实实验记录，「Cowrie 观察」那篇最热闹。',
  range:'想试试攻击输入？点上面的一键样本，判定全部来自后端检测组件。',
  about:'这个站点的一切口径都在这一页：数据从哪来、什么能说什么不能说。'
};
function switchView(v){
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('on'));
  document.getElementById(views[v]).classList.add('on');
  document.querySelectorAll('#dock button').forEach(b=>b.classList.toggle('on', b.dataset.v === v));
  document.body.classList.toggle('is-home', v === 'home');
  document.body.classList.toggle('is-ai', v === 'ai');
  if(v === 'home'){ if(window.__enterHome) window.__enterHome(); return; }
  if(v === 'monitor'){ if(opsTab==='live') drawSpark(); if(opsTab==='graph') startGraph(); if(opsTab==='stats') runCounters(); }
  speak(SAYS[v]);
}
document.querySelectorAll('#dock button').forEach(b=>b.onclick = ()=>switchView(b.dataset.v));

/* ============ AI 问答演示 ============ */
function askDemo(){
  const inp = document.getElementById('askInput'), log = document.getElementById('chatlog');
  const q = inp.value.trim(); if(!q) return; inp.value = '';
  log.insertAdjacentHTML('beforeend', '<div class="msg me"></div>');
  log.lastElementChild.textContent = q;
  log.lastElementChild.scrollIntoView({block:'end'});
  emo = 'sided_thinking'; mode = 'idle'; render();
  stateEl.textContent = 'THINKING';
  setTimeout(()=>{
    const refuse = q.includes('昨天') || q.includes('谁打');
    log.insertAdjacentHTML('beforeend', refuse
      ? '<div class="msg ai"><div class="who">AI 安全 · <span class="st">规则解析（拒答）</span></div>这个问题需要内部事件数据，公开问答不取证 —— 可以去「监测中心」看脱敏后的真实统计。</div>'
      : '<div class="msg ai"><div class="who">AI 安全 · <span class="st">模型研判</span></div>（演示回答）这是知识库检索 + 模型生成的答案正文，引用卡片会列出标题、片段、可信度与来源性质。<div class="cite">引用：《演示文档》· 可信度 0.88</div></div>');
    log.lastElementChild.scrollIntoView({block:'end'});
    emo = 'normal';
    speak(refuse ? '拒答也是真实现：公开面不做事件取证。' : '回答生成了。引用与状态标注都在消息里，可展开核验。');
  }, 900);
}
document.getElementById('askBtn').onclick = askDemo;
document.getElementById('askInput').addEventListener('keydown', e=>{ if(e.key === 'Enter') askDemo(); });

/* ============ 靶场演示 ============ */
const PG_DEMO = {
  '注入':     '<div class="verdict"><span class="chip bad">命中</span>提示词注入防护：判定为越权指令，动作 = 拒绝执行并告警。</div>',
  'SQL':      '<div class="verdict"><span class="chip warn">未命中 ≠ 无害</span>SQL 注入不属于输入扫描组件职责，判定仅供参考。</div>',
  '路径':     '<div class="verdict"><span class="chip bad">命中</span>路径穿越净化：检测到目录越界模式，动作 = 净化后放行并记录。</div>',
  'AccessKey':'<div class="verdict"><span class="chip bad">命中</span>敏感信息扫描：匹配 AccessKey 样式，动作 = 打标 + 告警。</div>',
  '天气':     '<div class="verdict"><span class="chip ok">未命中</span>三个组件均未命中。注意：未命中 ≠ 无害（后端 coverageWarning 常显）。</div>'
};
function runPg(text){
  const box = document.getElementById('pgResult');
  const key = Object.keys(PG_DEMO).find(k=>text.includes(k)) || '天气';
  emo = 'sided_thinking'; render();
  stateEl.textContent = 'THINKING';
  box.innerHTML = '<div class="verdict"><span class="chip">检测中…</span>输入已送往后端检测链路（演示为本地假结果）。</div>';
  setTimeout(()=>{
    box.innerHTML = PG_DEMO[key] + '<div class="comp"><div class="hd"><span class="sev" style="background:var(--acc)"></span>PROMPT-GUARD · 适用</div><p>依据与动作由服务端返回，前端不拼内部标记名；接口不可用时如实显示"检测链路不可达"。</p></div>';
    emo = 'normal';
    speak('检测完成。记住：未命中不等于无害，判不了就说判不了。');
  }, 800);
}
document.getElementById('pgBtn').onclick = ()=>{
  const v = document.getElementById('pgInput').value.trim(); if(v) runPg(v); };
document.querySelectorAll('.pgrun').forEach(b=>b.onclick = ()=>{
  document.getElementById('pgInput').value = b.dataset.pg; runPg(b.dataset.pg); });
</script>
<script id="scene-js">
(()=>{

/* ================= 数据：全部来自 static/kurisu/manifest.json ================= */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const CLIPS = {
  opening:  {src:'/kurisu/full/opening.hi.webp',  frames:84, interval:33.33, cols:8, cw:380, ch:290, fit:'screen',  next:'idle'},
  idle:     {src:'/kurisu/full/idle.hi.webp',     frames:60, interval:42,    cols:8, cw:321, ch:432, fit:'anchor'},
  speaking: {src:'/kurisu/full/speaking.hi.webp', frames:90, interval:34,    cols:8, cw:321, ch:432, fit:'anchor'},
  thinking: {src:'/kurisu/full/thinking.hi.webp', frames:90, interval:34,    cols:8, cw:321, ch:432, fit:'anchor'}
};
/* 角色落位（scene.character 源码公式）：scale=min(w*0.64/764,h*0.90/1028), x=0.52w, y=bottom-h*0.012, anchor=(0.5,1) */
const CHAR_BOX = {w:764, h:1028, maxW:0.64, maxH:0.90, xRatio:0.52, footRatio:0.012};

const stage = document.getElementById('stage');
const crt = document.getElementById('crt');
const canvas = document.getElementById('charCanvas');
const ctx = canvas.getContext('2d');
const cache = {};
function img(src){ if(!cache[src]){ const im=new Image(); im.src=src; cache[src]=im; } return cache[src]; }

let cur = null, acc = 0, fi = 0, lastT = 0, started = false;
let bounds = {w:0, h:0};

function resize(){
  const r = crt.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio || 1, 2);
  bounds = {w:r.width, h:r.height};
  canvas.width  = Math.round(r.width  * dpr);
  canvas.height = Math.round(r.height * dpr);
  /* 桌面实拍照常驻、CRT 完整可见的硬不变量：CRT 高度 <260px 触发降级 */
  document.getElementById('fallback').style.display = r.height < 260 ? 'grid' : 'none';
}

function drawFrame(){
  if(!cur) return;
  const c = CLIPS[cur];
  const im = img(c.src);
  if(!im.complete || !im.naturalWidth) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const sx = (fi % c.cols) * c.cw, sy = Math.floor(fi / c.cols) * c.ch;
  if(c.fit === 'screen'){
    /* fit=crt_screen：整帧铺满屏幕（开场特写） */
    ctx.drawImage(im, sx, sy, c.cw, c.ch, 0, 0, canvas.width, canvas.height);
  }else{
    /* anchor：源码落位公式 */
    const w = bounds.w * (canvas.width / bounds.w), h = bounds.h * (canvas.height / bounds.h);
    const s = Math.min(w * CHAR_BOX.maxW / CHAR_BOX.w, h * CHAR_BOX.maxH / CHAR_BOX.h);
    const dw = CHAR_BOX.w * s, dh = CHAR_BOX.h * s;
    const x = w * CHAR_BOX.xRatio, y = h - Math.max(3, h * CHAR_BOX.footRatio);
    ctx.drawImage(im, sx, sy, c.cw, c.ch, x - dw/2, y - dh, dw, dh);
  }
}

function play(name){
  const c = CLIPS[name];
  cur = name; fi = 0; acc = 0;
  img(c.src); drawFrame();
}

function loop(t){
  if(!started) return;
  if(cur){
    const c = CLIPS[cur];
    const im = img(c.src);
    if((im.complete && im.naturalWidth) && !RM){
      acc += t - lastT;
      if(acc >= c.interval){
        acc = 0; fi++;
        if(fi >= c.frames){
          if(cur === 'opening'){ play('idle'); showHud(); }   /* 硬切（原版机制） */
          else fi = fi % c.frames;
        }
        drawFrame();
      }
    }
  }
  lastT = t;
  requestAnimationFrame(loop);
}

/* 屏内 HUD：开场结束后出现 */
let hudShown = false;
function showHud(){
  if(hudShown) return; hudShown = true;
  document.getElementById('crtStatus').hidden = false;
  typeSub('你好，我是桐莉栖。监测数据都是真的——看不清就走近一点。');
}
let typeTimer = null;
function typeSub(text){
  const el = document.getElementById('subText'), sub = document.getElementById('crtSub');
  sub.hidden = false; el.textContent = '';
  clearInterval(typeTimer);
  let i = 0;
  typeTimer = setInterval(()=>{
    el.textContent = text.slice(0, ++i);
    if(i >= text.length) clearInterval(typeTimer);
  }, 45);
}

/* 启动：reduced-motion 直接静帧 */
resize(); addEventListener('resize', ()=>{ resize(); drawFrame(); });
if(RM){
  cur = 'idle'; fi = 0;
  const im = img(CLIPS.idle.src);
  (im.complete ? Promise.resolve() : new Promise(r=>im.onload=r)).then(()=>{ drawFrame(); showHud(); });
  document.getElementById('bootveil').style.opacity = 0;
  setTimeout(()=>document.getElementById('bootveil').remove(), 450);
}else{
  play('opening');
}
started = true; lastT = performance.now();
requestAnimationFrame(loop);
const veil = document.getElementById('bootveil');
const desk = document.querySelector('.desk');
(desk.complete ? Promise.resolve() : new Promise(r=>desk.onload=r)).then(()=>{
  veil.style.opacity = 0; setTimeout(()=>veil.remove(), 450);
});

/* 暴露给外壳切换 */
let introPlayed=false;
window.__enterHome=function(){
  resize(); drawFrame();
  const played=sessionStorage.getItem('xk-demo-intro');
  if(!RM && !played){ play('opening'); sessionStorage.setItem('xk-demo-intro','1'); }
  else if(!cur){ play('idle'); }
};
})();
</script>
