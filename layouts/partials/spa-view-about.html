{{/*
  ⑥ 关于 —— 规格 §4⑥：项目说明、SecAgent 架构/护栏/取舍与踩坑、个人介绍（原「项目」内容并入）。
  正文直接取仓库里的 Markdown（content/about、content/projects、content/demo），
  不做二次改写：文字是站主自己写的，前端只负责版面。
  三块合并成一栏，所以 /about/、/projects/、/demo/ 三个老地址都落到这里，不会出现 404。
*/}}
<template id="tpl-about">
  <div class="xk-wrap xk-page">
    {{/* 追加要求 ②：顶部介绍大卡已删除（返工后连整段说明也去掉）。
         这里只留【模块名 + 一行极简副标题】+ 本页小节锚点（锚点是真导航，不是介绍）。 */}}
    <header class="xk-page__hd">
      <div class="xk-page__plate">
        <h1 class="xk-page__title">关于</h1>
        <p class="xk-page__lead">个人介绍 · SecAgent · 在线 Demo</p>
      </div>
      <nav class="xk-anchors" aria-label="本页小节">
        <a class="xk-chip" href="#xk-about-me" data-xk-anchor>我是谁</a>
        <a class="xk-chip" href="#xk-about-project" data-xk-anchor>项目：SecAgent</a>
        <a class="xk-chip" href="#xk-about-demo" data-xk-anchor>在线 Demo</a>
      </nav>
    </header>

    <div class="xk-portal">
      <div class="xk-portal__main">
        <section class="xk-card" id="xk-about-me">
          <header class="xk-card__hd"><h2 class="xk-card__title">个人介绍</h2></header>
          <div class="xk-md">{{ with site.GetPage "/about" }}{{ .Content }}{{ end }}</div>
        </section>

        <section class="xk-card" id="xk-about-project">
          <header class="xk-card__hd"><h2 class="xk-card__title">项目：SecAgent</h2></header>
          <div class="xk-md">{{ with site.GetPage "/projects" }}{{ .Content }}{{ end }}</div>
        </section>

        <section class="xk-card" id="xk-about-demo">
          <header class="xk-card__hd"><h2 class="xk-card__title">在线 Demo</h2></header>
          <div class="xk-md">{{ with site.GetPage "/demo" }}{{ .Content }}{{ end }}</div>
        </section>
      </div>

      <aside class="xk-portal__side">
        {{/* 追加要求 ②：各栏目顶部被删掉的介绍文字，完整说明挪到这一张卡里（不丢信息） */}}
        <section class="xk-card xk-card--tight" id="xk-about-modules">
          <header class="xk-card__hd"><h2 class="xk-card__title">各栏目在做什么</h2></header>
          <ul class="xk-bullets xk-note">
            <li><b>监测中心</b>：主机层（Wazuh）与网络层（Suricata）告警、蜜罐战报、处置审计与系统指纹 —— 全部来自公开只读端点，源 IP 已掩码，只读不可写。</li>
            <li><b>笔记</b>：按分类整理的学习与实践记录：渗透文档、课堂笔记、个人总结、CVE 复现、速查表。</li>
            <li><b>攻防靶场</b>：只剩两种互动，真的把输入送进我方后端检测组件、看它原样返回什么；公网不放真实漏洞应用，模拟器也不假装能防住攻击。</li>
            <li><b>AI 安全</b>：对着知识库提问、或直接检索文档库；答案、引用与状态标注全部来自后端公开只读端点，模型没生成就如实写原因，不补假结论。</li>
          </ul>
          <p class="xk-note">这四段说明原来挂在各模块顶部（占掉半屏），现在集中放在这里。</p>
        </section>
        <section class="xk-card xk-card--tight">
          <header class="xk-card__hd"><h2 class="xk-card__title">站点事实</h2></header>
          <ul class="xk-meta">
            <li><span>技术栈</span><b>Hugo + 原生 HTML/CSS/JS</b></li>
            <li><span>依赖</span><b>零框架 / 零第三方脚本</b></li>
            <li><span>主题</span><b>自建（不用第三方主题）</b></li>
            <li><span>笔记</span><b>{{ len (where site.RegularPages "Section" "posts") }} 篇</b></li>
            <li><span>数据</span><b>只读公开端点</b></li>
          </ul>
        </section>
        <section class="xk-card xk-card--tight">
          <header class="xk-card__hd"><h2 class="xk-card__title">找东西</h2></header>
          <ul class="xk-list">
            <li><a class="xk-link" href="/#/notes" data-xk-route>全部笔记</a></li>
            <li><a class="xk-link" href="/#/monitor/alerts" data-xk-route>监测中心</a></li>
            <li><a class="xk-link" href="/#/range" data-xk-route>攻防靶场</a></li>
          </ul>
        </section>
      </aside>
    </div>
  </div>
</template>
