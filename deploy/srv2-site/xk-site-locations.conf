# --- ACME HTTP-01 (managed by srv2-site-tls-issue.sh) ---
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }
        # ============================================================
        # 博客整站 location 集（被「隧道 18080 块」与「公网 443 块」共用）
        #   · 只 GET/HEAD（server 级已 405 兜底，这里再 limit_except 一次）
        #   · 带扩展名的静态资源绝不回落到 index.html（缺图必须真 404）
        #   · /kurisu/** 与 /images/** 长缓存；css/js/json 短缓存；HTML no-cache
        # ============================================================
        location ~ ^/(kurisu|images)/ {
            limit_except GET { deny all; }
            try_files $uri =404;
            add_header Cache-Control "public, max-age=2592000" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location ~* \.(?:woff2?|ttf|otf|eot|mp4|webm|mp3|ogg|avif|webp|png|jpe?g|gif|svg|ico)$ {
            limit_except GET { deny all; }
            try_files $uri =404;
            add_header Cache-Control "public, max-age=2592000" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location ~* \.(?:css|js|mjs|json|xml|txt|map)$ {
            limit_except GET { deny all; }
            try_files $uri =404;
            add_header Cache-Control "public, max-age=300" always;
            add_header X-Content-Type-Options nosniff always;
        }

        # HTML / 目录。★2026-10-16 改为**真 404**：
        #   原先 `try_files $uri $uri/ /index.html` 让任何不存在的路径都返回 200 + 首页
        #   （删掉 /projects/ 后旧链接不 404 而是显示首页，对访客与搜索引擎都是误导）。
        #   注：hash 路由（/#/notes）的片段根本不会发到服务端，**不需要**服务端兜底，
        #   所以去掉它不会影响 SPA；站点各页都是 Hugo 生成的真实目录。
        #   server 级已有 `error_page 404 /404.html` ⇒ 这里只把回落目标改成 404。
        location / {
            limit_except GET { deny all; }
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
        }

        # 隐藏文件/点文件一律拒绝
        location ~ /\. { deny all; }
