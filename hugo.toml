# ============================================================
# 博客站点配置（Hugo + PaperMod）
# ------------------------------------------------------------
# ⚠️ 部署前必须改的三处（已用 TODO 标出）：
#    1. baseURL —— 换成你的 GitHub Pages 地址
#    2. title / 作者 / 简介
#    3. socialIcons 里的 GitHub 链接
# ============================================================

# ⚠️ 暂用 github.io：apex 域名 xiaokeqing.cn 目前在 Cloudflare 里【没有任何解析记录】
# （zone 只有 demo.xiaokeqing.cn → tunnel 一条），公共 DNS 查 A/CNAME 全部 ENODATA。
# 顺序不能颠倒 —— 一旦 Pages 绑定自定义域，github.io 会被 301 到那个死域名，
# 连唯一能访问的地址都会挂。所以：
#   ① 先加 apex + www 的 DNS 记录并验证解析
#   ② 再部署 static/CNAME（Pages 绑定自定义域）
#   ③ 同一批把 baseURL 换成 https://xiaokeqing.cn/
baseURL = "https://xiaokeqing.github.io/"
title = "知微安全实验室"
# Hugo 0.158 起 languageCode 已废弃，改用 locale
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true
enableEmoji = true
# 让 Hugo 正确处理中文分词与字数统计
hasCJKLanguage = true

# ---------- 站点参数 ----------
[params]
  env = "production"
  # TODO 2：简介与关键词
  description = "知微安全实验室 —— 网络安全方向的学习与技术记录：AI 安全运营、应急响应、Linux 加固"
  keywords = ["网络安全", "AI 安全", "安全运营", "应急响应", "RAG", "多 Agent", "SOC"]
  author = "xiaokeqing"

  # 工作台（首页 / /alerts/）取数的【公开只读】接口基址。
  # 这一层刻意与"写操作"分开：页面里只调用 /api/public/*，
  # 匿名、只读、IP 掩码、独立限流，因此前端不含任何 Token。
  # 换机器/换域名时只改这一处。
  wbApiBase = "https://demo.xiaokeqing.cn"

  DateFormat = "2006-01-02"
  # 站点默认深色。
  # 为什么不是 auto：工作台（首页 / /alerts/）是深色运营台，
  # 若跟随系统且系统是浅色，导航栏、页脚、页面留白会全是浅色 ——
  # 出现"深色数据面板浮在白底上"的割裂感（实测截图就是这样）。
  # 写成 dark 后 PaperMod 的外壳也走深色；访客仍可用右上角开关切浅色，
  # 切换只影响站点外壳，工作台内容区始终是深色（见 workbench-app.css 的作用域令牌）。
  defaultTheme = "dark"
  disableThemeToggle = false

  # ---------- 文章页显示项 ----------
  ShowReadingTime = true
  ShowWordCount = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowToc = true
  TocOpen = false
  UseHugoToc = true
  # 关闭第三方分享按钮：不引入外部脚本，保持零第三方依赖
  ShowShareButtons = false
  # 评论后续用 Giscus 接入（基于 GitHub Discussions，无自建后端）
  comments = false

  # 首页简介
  [params.homeInfoParams]
    Title = "知微安全实验室"
    Content = """
**知微** —— 取「见微知著」：从细微的异常里，看出真正的攻击。

这里记录我在网络安全方向的实践：把 RAG 与多 Agent 落到安全运营场景、在公网环境里做加固与响应、以及一路踩过的坑。

<div class="hero-cta">
<a class="hero-btn is-primary" href="/demo/">在线 Demo</a>
<a class="hero-btn" href="/labs/">试试靶场</a>
<a class="hero-btn" href="/projects/">看项目</a>
</div>
"""

  # 社交图标。注意：这里只能用 [[params.socialIcons]] 数组写法，
  # 不能再写一行 [params.socialIcons]，否则 TOML 会报"表与数组表冲突"。
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/xiaokeqing"
  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

# ---------- 导航菜单 ----------
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "labs"
    name = "靶场"
    url = "/labs/"
    weight = 20
  [[menu.main]]
    identifier = "demo"
    name = "在线 Demo"
    url = "/demo/"
    weight = 25
  [[menu.main]]
    identifier = "projects"
    name = "项目"
    url = "/projects/"
    weight = 30
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 40

# ---------- Markdown 与代码高亮 ----------
[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    lineNumbersInTable = true
  [markup.goldmark.renderer]
    # 允许文章内嵌原始 HTML。
    # 做「交互式安全演示」时需要在 Markdown 里写 iframe / form 等标签。
    # 本站内容全部由仓库自行维护、无用户投稿，因此风险可控。
    unsafe = true

# ---------- 输出格式 ----------
[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
