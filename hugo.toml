# ============================================================
# 博客站点配置（Hugo + PaperMod）
# ------------------------------------------------------------
# ⚠️ 部署前必须改的三处（已用 TODO 标出）：
#    1. baseURL —— 换成你的 GitHub Pages 地址
#    2. title / 作者 / 简介
#    3. socialIcons 里的 GitHub 链接
# ============================================================

# 正式域名。前置条件已全部满足（2026-10-12 核实）：
#   ① apex 与 www 在 AliDNS / 腾讯 / 8.8.8.8 三家都解析到 Cloudflare
#   ② CF 已在转发（https://xiaokeqing.cn/ 返回 CF 的 404，说明只是 GitHub 还不认这个域）
#   ③ 现在部署 static/CNAME，Pages 绑定自定义域；github.io 会 301 到正式域名
baseURL = "https://xiaokeqing.cn/"
title = "小刻晴的博客"
# Hugo 0.158 起 languageCode 已废弃，改用 locale
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true
enableEmoji = true
# 让 Hugo 正确处理中文分词与字数统计
hasCJKLanguage = true

# ---------- 站点参数 ----------
[params]
  env = "production"
  # TODO 2：简介与关键词
  description = "小刻晴的博客 —— 网络安全方向的学习与实践记录：应急响应、Linux 加固、AI 安全运营，以及一个真在跑的安全运营工作台"
  keywords = ["网络安全", "AI 安全", "安全运营", "应急响应", "RAG", "多 Agent", "SOC"]
  author = "xiaokeqing"

  # 工作台（首页 / /alerts/）取数的【公开只读】接口基址。
  # 这一层刻意与"写操作"分开：页面里只调用 /api/public/*，
  # 匿名、只读、IP 掩码、独立限流，因此前端不含任何 Token。
  # 换机器/换域名时只改这一处。
  wbApiBase = "https://demo.xiaokeqing.cn"

  DateFormat = "2006-01-02"
  # 固定浅色，并且【关掉日夜切换】。
  # 只有一套主题：维护两套意味着每个组件都要在两个底色下各自验证一次对比度，
  # 而安全站点最不能出的问题就是"某个状态文字在深色下看不见"。
  # 光设 light 还不够 —— 访客浏览器里可能残留旧的偏好（localStorage），
  # 所以 workbench.css 里同时把 :root[data-theme="dark"] 也覆盖成浅色值。
  defaultTheme = "light"
  disableThemeToggle = true

  # ---------- 文章页显示项 ----------
  ShowReadingTime = true
  ShowWordCount = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowToc = true
  TocOpen = false
  UseHugoToc = true
  # 关闭第三方分享按钮：不引入外部脚本，保持零第三方依赖
  ShowShareButtons = false
  # 评论后续用 Giscus 接入（基于 GitHub Discussions，无自建后端）
  comments = false

  # 首页简介
  [params.homeInfoParams]
    Title = "知微安全实验室"
    Content = """
**知微** —— 取「见微知著」：从细微的异常里，看出真正的攻击。

这里记录我在网络安全方向的实践：把 RAG 与多 Agent 落到安全运营场景、在公网环境里做加固与响应、以及一路踩过的坑。

<div class="hero-cta">
<a class="hero-btn is-primary" href="/demo/">在线 Demo</a>
<a class="hero-btn" href="/labs/">试试靶场</a>
<a class="hero-btn" href="/projects/">看项目</a>
</div>
"""

  # 社交图标。注意：这里只能用 [[params.socialIcons]] 数组写法，
  # 不能再写一行 [params.socialIcons]，否则 TOML 会报"表与数组表冲突"。
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/xiaokeqing"
  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

# ---------- 导航菜单 ----------
[menu]
  # 顶栏 = 栏目切换器：logo 与头像在两端，导航项居中（不放右边）。
  # 功能项用 /#xxx 锚点：点它【不跳页】，只在中栏换成对应栏目。
  #
  # 【六栏目口径 · 已定改版】主页 / 笔记 / 态势感知 / AI 安全 / 攻防靶场 / 关于
  #   · 态势感知 ← 原「实时告警看板」，并新并入「处置审计」块（真实封禁留痕）
  #   · AI 安全   ← 新增，放 AI 研判 5 态（含 rule-based 共 6 个取值）的口径映射
  #   · 攻防靶场 ← 原「靶场」+ 原「战报评测」的蜜罐战报（靶场=公开模拟环境的战报）
  # 纪律不变：顶栏只放现在已经能打开看的内容。
  # 「项目」（/projects/）与「公开模拟靶场」（/labs/）不在顶栏里，改由
  # 主页"内容模块"与「攻防靶场」栏目内链进入 —— 页面本身都保留、没有删。
  [[menu.main]]
    identifier = "home"
    name = "主页"
    url = "/#home"
    weight = 5
  [[menu.main]]
    identifier = "notes"
    name = "笔记"
    url = "/#notes"
    weight = 10
  [[menu.main]]
    identifier = "situ"
    name = "态势感知"
    url = "/#situ"
    weight = 20
  [[menu.main]]
    identifier = "ai"
    name = "AI 安全"
    url = "/#ai"
    weight = 30
  [[menu.main]]
    identifier = "range"
    name = "攻防靶场"
    url = "/#range"
    weight = 40
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 70

# ---------- Markdown 与代码高亮 ----------
[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    lineNumbersInTable = true
  [markup.goldmark.renderer]
    # 允许文章内嵌原始 HTML。
    # 做「交互式安全演示」时需要在 Markdown 里写 iframe / form 等标签。
    # 本站内容全部由仓库自行维护、无用户投稿，因此风险可控。
    unsafe = true

# ---------- 输出格式 ----------
[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
