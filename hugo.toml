# ============================================================
# xiaokeqing 博客 · 站点配置（前端改版 · 按《前端改版规格-xiaokeqing.md》实施）
# ------------------------------------------------------------
# 改版要点（与规格一一对应）：
#   §0  技术栈：Hugo + 原生 HTML/CSS/JS，**不使用任何第三方主题**。
#        → 本次已把 `theme = "PaperMod"` 摘掉，layouts/ 与 assets/css/ 全部自建；
#          代码高亮样式由 `hugo gen chromastyles --style=github` 生成为自己的 CSS。
#   §2  导航就 6 项：主页 / 笔记 / 监测中心 / AI 安全 / 攻防靶场 / 关于
#        （原「态势感知」→「监测中心」；原「项目」并入「关于」）
#   §5  公开数据只走 /api/public/*（只读、IP 掩码），前端轮询 10–15s 自适应。
#   发布改走 GitHub Pages Actions（push 自动构建），不再用本机 deploy 脚本。
# ============================================================

baseURL = "https://xiaokeqing.cn/"
title = "xiaokeqing"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"

# 规格 §0：禁止第三方主题。这里刻意不再声明 theme。
# （themes/PaperMod 目录仍留在工作区里未删除，但已不在构建路径上 —— 详见交付说明。）

enableRobotsTXT = true
enableEmoji = true
# 让 Hugo 正确处理中文分词与字数统计
hasCJKLanguage = true

# ---------- 站点参数 ----------
[params]
  siteName = "xiaokeqing"
  author = "小刻晴"
  description = "xiaokeqing 的个人博客 —— 个人网络安全学习实践记录，以及一个正在真实运行的安全运营工作台（告警 / 蜜罐 / 处置审计）。"
  keywords = ["网络安全", "AI 安全", "安全运营", "应急响应", "RAG", "多 Agent", "SOC"]

  # 工作台（监测中心 / 主页实时动态）取数的【公开只读】接口基址。
  # 页面里只调用 /api/public/* 与 /api/health：匿名、只读、IP 掩码、服务端 15s 缓存 + 20 次/分钟限流。
  # 换机器/换域名时只改这一处（模板会把它写进 <meta name="wb-api">）。
  wbApiBase = "https://demo.xiaokeqing.cn"

  # §1 欢迎区文案（主页门户版式）
  # 站主 2026-10-12 第七轮 ①："一句话介绍（压成一行）" → 文案压成一行能放下的长度
  # （旧值：个人网络安全的学习与实践记录 —— 同时挂着我在真实运行的安全运营工作台：主机/网络告警、蜜罐战报、带护栏与审计的处置链路。）
  # 站主 2026-10-13 第九轮：品牌名单独放大做视觉主体 → 主标题只留欢迎语，站名交给 heroBrand。
  heroBrand = "xiaokeqing"
  heroTitle = "欢迎来到我的个人博客"
  heroLead = "个人网络安全的学习与实践记录，外加一个真实在跑的安全运营工作台。"

  # ---------- Hero 第四个数字：单元测试数 ----------
  # 为什么是常量而不是现场取：博客是静态站，构建期不会去跑后端测试；
  # 真值来自 SecAgent 仓库自己的 surefire 汇总（不是估算、不是示例值）：
  #   F:\7AAA\AI\SecAgent\sec-agent\target\surefire-reports\TEST-*.xml 逐类求和
  #   → Tests run 239 · Failures 0 · Errors 0 · Skipped 3
  # 口径写在页面上（主页 Hero 与「关于」页都标），改数只改这一处。
  testsRun = 239
  testsSkipped = 3
  testsFailed = 0
  testsAsOf = "2026-10-13"
  testsSource = "SecAgent · sec-agent/target/surefire-reports 汇总（Tests run / Failures / Skipped）"

# ---------- 导航菜单（§2：就这 6 项、按此顺序与名称） ----------
# url 用 /#/<route> 形式：点击只替换 #content，背景层与胶囊导航不动（不整页跳转）。
# 名称与顺序是硬约束，模板按 weight 顺序渲染。
[[menu.main]]
  identifier = "home"
  name = "主页"
  url = "/#/home"
  weight = 10
[[menu.main]]
  identifier = "notes"
  name = "笔记"
  url = "/#/notes"
  weight = 20
[[menu.main]]
  identifier = "monitor"
  name = "监测中心"
  url = "/#/monitor/alerts"
  weight = 30
[[menu.main]]
  identifier = "ai"
  name = "AI 安全"
  url = "/#/ai"
  weight = 40
[[menu.main]]
  identifier = "range"
  name = "攻防靶场"
  url = "/#/range"
  weight = 50
[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/#/about"
  weight = 60

# ---------- 分页 ----------
[pagination]
  pagerSize = 10

# ---------- Markdown 与代码高亮 ----------
[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    lineNumbersInTable = true
  [markup.goldmark.renderer]
    # 允许文章内嵌原始 HTML（站内文章全部由仓库自行维护、无用户投稿，风险可控）。
    unsafe = true

# ---------- 输出格式 ----------
# home 额外输出 JSON：SPA 的笔记阅读/搜索索引（/index.json），
# 由 layouts/index.json 生成，内容全部来自仓库里的 Markdown，不含第三方服务。
[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
